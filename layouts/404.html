{{ define "content" }}
<section class="min-h-screen flex flex-col items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="text-center">
    <h1 class="text-8xl font-bold text-primary-accent mb-4">404</h1>
    <h2 class="text-3xl font-semibold text-primary-text mb-6">Page not found</h2>
    <p class="text-lg text-primary-text-secondary mb-8">The page you're looking for doesn't exist.</p>
    <a href="{{ .Site.BaseURL }}" class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md text-primary-bg bg-primary-accent hover:bg-primary-accent-secondary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-accent transition-colors duration-200">
      Go back to Homepage

  </div>
