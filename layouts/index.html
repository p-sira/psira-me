{{ define "content" }}

<section id="hero-section" class="min-h-screen flex items-center justify-center px-4 sm:px-6 lg:px-8">
  <div class="flex flex-col my-8 lg:flex-row w-full max-w-6xl justify-between items-center lg:items-start">

    <!-- Left Column -->
    <div
      class="flex flex-col justify-center items-center w-full lg:w-1/3 relative mb-8 lg:mb-0 lg:-translate-y-20 order-2 lg:order-1 mobile-button-group z-10">
      <button class="arc-button popup-button lg:-translate-y-12" data-card="about">About</button>
      <button class="arc-button popup-button lg:-translate-x-8" data-card="research">Research</button>
      <button class="arc-button popup-button lg:translate-y-12" data-card="achievements">Achievements</button>
    </div>

    <!-- Center Column -->
    <div
      class="flex flex-col justify-center items-center w-full lg:w-1/3 mb-8 lg:mb-0 lg:-translate-y-24 order-1 lg:order-2">
      <div class="relative justify-center h-32 w-32 sm:h-40 sm:w-40 lg:h-48 lg:w-48 mb-4">
        <img src="images/white-coat.jpg" alt="Profile Picture Light" class="profile-image dark:opacity-0">
        <img src="images/suit.jpg" alt="Profile Picture Dark" class="profile-image opacity-0 dark:opacity-100">
        <div
          class="absolute inset-0 flex items-center justify-center scale-0 lg:scale-100 transition-transform duration-1200 lg:duration-500 ease-in-out -z-99">
          <div
            class="absolute w-250 h-250 bg-gradient-to-t from-transparent from-20% to-[var(--bg-primary)] to-70% rounded-full -z-100 transition-colors duration-1000">
          </div>
          <div class="profile-circle w-82 h-82 -z-101"></div>
          <div class="profile-circle w-144 h-144 -z-102"></div>
          <div class="profile-circle w-206 h-206 -z-103"></div>
        </div>
      </div>
      <h1 class="text-2xl sm:text-3xl lg:text-4xl font-bold text-primary mb-2 text-center">Sira Pornsiriprasert</h1>
      <p class="text-lg sm:text-xl text-secondary text-center">M.D.-M.Eng. Student</p>
    </div>

    <!-- Right Column -->
    <div
      class="flex flex-col justify-center items-center w-full lg:w-1/3 relative lg:-translate-y-20 order-3 mobile-button-group z-10">
      <button class="arc-button popup-button lg:-translate-y-12" data-card="code">Code</button>
      <button class="arc-button popup-button lg:translate-x-10" data-card="experience">Experience</button>
      <button class="arc-button lg:translate-y-12" id="contact-button">Contact</button>
    </div>

  </div>
</section>

<!-- Popup Cards -->
<section id="popup-section">
  <div id="popup-backdrop"
    class="fixed inset-0 bg-black opacity-0 invisible transition-all duration-300 ease-in-out z-40 backdrop-blur-lg"
    aria-hidden="true">
  </div>
  <div class="fixed inset-1/2 z-50 w-screen h-screen pointer-events-none" aria-live="polite">
    {{ partial "popup_cards/about_card" . }}
    {{ partial "popup_cards/research_card" . }}
    {{ partial "popup_cards/achievements_card" . }}
    {{ partial "popup_cards/code_card" . }}
    {{ partial "popup_cards/experience_card" .}}
  </div>
</section>

{{ end }}
