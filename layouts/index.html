{{ define "content" }}

<section class="min-h-screen flex items-center justify-center px-8">
  <div class="flex w-full max-w-6xl justify-between">

    <!-- Left Column -->
    <div class="flex flex-col justify-center items-center w-1/3 relative -translate-y-20">
      <button class="arc-button -translate-y-12">About</button>
      <button class="arc-button -translate-x-8">Research</button>
      <button class="arc-button translate-y-12">Achievements</button>
    </div>

    <!-- Center Column -->
    <div class="flex flex-col justify-center items-center w-1/3 -translate-y-24">
      <div class="relative justify-center h-48 w-48 mb-4">
        <img src="images/white-coat.jpg" alt="Profile Picture Light"
          class="absolute h-full w-full object-cover rounded-full border-4 border-primary shadow-2xl transition-opacity duration-500 ease-in-out opacity-100 dark:opacity-0 pointer-events-none">
        <img src="images/suit.jpg" alt="Profile Picture Dark"
          class="absolute h-full w-full object-cover rounded-full border-4 border-primary shadow-2xl transition-opacity duration-500 ease-in-out opacity-0 dark:opacity-100 pointer-events-none">
      </div>
      <h1 class="text-4xl font-bold text-primary mb-2">Sira Pornsiriprasert</h1>
      <p class="text-xl text-secondary">M.D.-M.Eng. Student</p>
    </div>

    <!-- Right Column -->
    <div class="flex flex-col justify-center items-center w-1/3 relative -translate-y-20">
      <button class="arc-button -translate-y-12">Code</button>
      <button class="arc-button translate-x-10">Experience</button>
      <button class="arc-button translate-y-12">Contact</button>
    </div>

  </div>
</section>

{{ end }}
