{{ if .Paginator }}
<nav class="flex justify-center items-center space-x-2 mt-12">
    {{ if .Paginator.HasPrev }}
    <a href="{{ .Paginator.Prev.URL }}" class="px-4 py-2 text-sm font-medium text-primary-text-secondary bg-primary-bg border border-primary-border rounded-md hover:bg-primary-accent/10 hover:text-primary-accent hover:border-primary-accent transition-all duration-200">← Previous</a>
    {{ end }}
    
    {{ range .Paginator.Pagers }}
    {{ if eq . $ }}
    <span class="px-4 py-2 text-sm font-medium text-primary-bg bg-primary-accent border border-primary-accent rounded-md">{{ .PageNumber }}</span>
    {{ else }}
    <a href="{{ .URL }}" class="px-4 py-2 text-sm font-medium text-primary-text-secondary bg-primary-bg border border-primary-border rounded-md hover:bg-primary-accent/10 hover:text-primary-accent hover:border-primary-accent transition-all duration-200">{{ .PageNumber }}</a>
    {{ end }}
    {{ end }}
    
    {{ if .Paginator.HasNext }}
    <a href="{{ .Paginator.Next.URL }}" class="px-4 py-2 text-sm font-medium text-primary-text-secondary bg-primary-bg border border-primary-border rounded-md hover:bg-primary-accent/10 hover:text-primary-accent hover:border-primary-accent transition-all duration-200">Next →</a>
    {{ end }}
</nav>
{{ end }}
