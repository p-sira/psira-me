{{ if .Paginator }}
<nav class="flex justify-center items-center space-x-1 sm:space-x-2 mt-8 sm:mt-12">
    {{ if .Paginator.HasPrev }}
    <a href="{{ .Paginator.Prev.URL }}" class="px-3 py-2 sm:px-4 sm:py-2 text-xs sm:text-sm font-medium text-primary-text-secondary bg-primary-bg border border-primary-border rounded-md hover:bg-primary-accent/10 hover:text-primary-accent hover:border-primary-accent transition-all duration-200 touch-target">← Previous</a>
    {{ end }}
    
    {{ range .Paginator.Pagers }}
    {{ if eq . $ }}
    <span class="px-3 py-2 sm:px-4 sm:py-2 text-xs sm:text-sm font-medium text-primary-bg bg-primary-accent border border-primary-accent rounded-md touch-target">{{ .PageNumber }}</span>
    {{ else }}
    <a href="{{ .URL }}" class="px-3 py-2 sm:px-4 sm:py-2 text-xs sm:text-sm font-medium text-primary-text-secondary bg-primary-bg border border-primary-border rounded-md hover:bg-primary-accent/10 hover:text-primary-accent hover:border-primary-accent transition-all duration-200 touch-target">{{ .PageNumber }}</a>
    {{ end }}
    {{ end }}
    
    {{ if .Paginator.HasNext }}
    <a href="{{ .Paginator.Next.URL }}" class="px-3 py-2 sm:px-4 sm:py-2 text-xs sm:text-sm font-medium text-primary-text-secondary bg-primary-bg border border-primary-border rounded-md hover:bg-primary-accent/10 hover:text-primary-accent hover:border-primary-accent transition-all duration-200 touch-target">Next →</a>
    {{ end }}
</nav>
{{ end }}
