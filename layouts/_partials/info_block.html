{{ define "info_block" }}
<div class="border-l-3 pl-4 mb-4">
    <h3 class="text-lg font-semibold text-primary mb-2">{{ .title | default .Title }}</h3>
    {{ if .raw }}
        <div class="text-tertiary">{{ .raw | safeHTML }}</div>
    {{ else if .content }}
        <p class="text-tertiary">{{ .content }}</p>
    {{ end }}
</div>
{{ end }}
