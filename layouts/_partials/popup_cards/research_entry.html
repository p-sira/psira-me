<div class="border-l-4 pl-4">
  <h4 class="text-lg font-semibold text-primary mb-2">
    {{ if .url }}
      <a href="{{ .url }}" target="_blank" rel="noopener noreferrer" class="hover:underline">{{ .title }}</a>
    {{ else }}
      {{ .title }}
    {{ end }}
  </h4>
  <p class="text-secondary mb-2">{{ .subtitle }}</p>
  {{ if .authors }}
    <p class="text-tertiary mb-1">{{ .authors }}</p>
  {{ end }}
  {{ if .year }}
    <p class="text-tertiary text-sm">{{ .year }}</p>
  {{ end }}
</div>
