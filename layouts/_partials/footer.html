<footer id="footer" class="bg-secondary">
    <div class="max-w-7xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
            <!-- Brand Section -->
            <div class="col-span-1 md:col-span-2">
                <h3 class="text-lg font-semibold text-primary-text mb-4">{{ .Site.Title }}</h3>
                <p class="text-primary-text-secondary text-sm leading-relaxed mb-4">
                    {{ .Site.Params.description }}
                </p>
            </div>

            <div>
                <h4 class="footer-links">Quick Links</h4>
                <ul class="space-y-2">
                    <li class="text-sm"><a href="{{ .Site.BaseURL }}" class="footer-link">Home</a></li>
                    <li class="text-sm"><a href="{{ .Site.BaseURL }}/#research" class="footer-link">Research</a></li>
                    <li class="text-sm"><a href="{{ .Site.BaseURL }}/#code" class="footer-link">Code & Projects</a></li>
                    <li class="text-sm"><a href="{{ .Site.BaseURL }}/#contact" class="footer-link">Contact</a></li>
                </ul>
            </div>

            <div>
                <h4 class="footer-links">Emails</h4>
                <ul class="space-y-2">
                    <li class="text-sm">contact@psira.me</li>
                    <li class="text-sm">research@psira.me</li>
                    <li class="text-sm">code@psira.me</li>
                </ul>
            </div>
        </div>

        <!-- Bottom Section -->
        <div class="mt-8 pt-8 border-t border-primary-border">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <p class="text-primary-text-tertiary text-sm">
                    &copy; {{ now.Format "2006" }} {{ .Site.Title }}. All rights reserved.
                </p>
                <div class="flex gap-3 my-2">
                    <a href="mailto:contact@psira.me"><i class="fas fa-envelope footer-icon"></i></a>
                    <a href="https://github.com/p-sira"><i class="fa-brands fa-github footer-icon"></i></a>
                    <a href="https://instagram.com/_psira_"><i class="fa-brands fa-instagram footer-icon"></i></a>
                    <a href="https://orcid.org/0000-0002-5636-8870"><i class="fa-brands fa-orcid footer-icon"></i></a>
                </div>
            </div>
        </div>
    </div>
</footer>
