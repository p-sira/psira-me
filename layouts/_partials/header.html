<script>
    document.addEventListener('DOMContentLoaded', function () {
        document.getElementById("theme-toggle").addEventListener("click", () => {
            const isDark = document.documentElement.classList.contains('dark');
            const sunIcon = document.getElementById('sun');
            const moonIcon = document.getElementById('moon');

            if (isDark) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem("pref-theme", 'light');
                // Trigger sun rising animation
                sunIcon.classList.add('rising-sun');
                setTimeout(() => sunIcon.classList.remove('rising-sun'), 1000);
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem("pref-theme", 'dark');
                // Trigger moon rising animation
                moonIcon.classList.add('rising-moon');
                setTimeout(() => moonIcon.classList.remove('rising-moon'), 1000);
            }
        });

        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl)
        })
    });
</script>
