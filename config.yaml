baseURL: "https://psira.me/"
languageCode: "en-us"
title: "Psira"
description: "Personal website and blog of Sira Pornsiriprasert"

params:
  dateFormat: "January 2, 2006"
  author: "Sira Pornsiriprasert"

build:
  buildStats:
    enable: true
  cachebusters:
  - source: 'assets/notwatching/hugo_stats\.json'
    target: css
  - source: '(postcss|tailwind)\.config\.js'
    target: css
  - source: 'assets/css/.*\.css'
    target: css
module:
  mounts:
  - source: assets
    target: assets
  - disableWatch: true
    source: hugo_stats.json
    target: assets/notwatching/hugo_stats.json
